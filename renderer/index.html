<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
<title>MemberManager</title>
<!-- Bundled, so the app looks right without an internet connection. -->
<link rel="stylesheet" href="../node_modules/@fontsource/poppins/300.css" />
<link rel="stylesheet" href="../node_modules/@fontsource/poppins/400.css" />
<link rel="stylesheet" href="../node_modules/@fontsource/poppins/500.css" />
<link rel="stylesheet" href="../node_modules/@fontsource/poppins/600.css" />
<!-- For member cards: a zero with a slash through it (lib/cards.js). -->
<link rel="stylesheet" href="../node_modules/@fontsource/atkinson-hyperlegible/400.css" />
<link rel="stylesheet" href="../node_modules/@fontsource/atkinson-hyperlegible/700.css" />
<link rel="stylesheet" href="../node_modules/@fontsource/atkinson-hyperlegible/400-italic.css" />
<link rel="stylesheet" href="../node_modules/@fontsource/atkinson-hyperlegible/700-italic.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <img class="logo" src="assets/logo-primary-lockup.jpg" alt="Anabaptist Brotherhood" />
        <span class="app-name">MemberManager</span>
      </div>
      <div class="app-header-end" id="team-line" hidden></div>
    </header>
    <div id="app-body">
      <nav id="nav">
        <button class="nav-btn" data-page="find">Find</button>
        <button class="nav-btn" data-page="contacts">Members</button>
        <button class="nav-btn" data-page="lists">Lists</button>
        <button class="nav-btn" data-page="near">Near ZIP</button>
        <button class="nav-btn" data-page="cards">Cards</button>
        <button class="nav-btn" data-page="fields">Fields</button>
        <button class="nav-btn" data-page="duplicates">Duplicates <span class="nav-badge" id="duplicates-badge"></span></button>
        <button class="nav-btn" data-page="settings">Settings</button>
        <div class="nav-footer">Version <span id="version-tag"></span></div>
      </nav>
      <div id="main-col">
        <div id="team-banner" hidden></div>
        <main id="content"></main>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <script src="../lib/contactRules.js"></script>
  <script src="../lib/fields.js"></script>
  <script src="app.js"></script>
  <script src="grid.js"></script>
  <script src="pages/contacts.js"></script>
  <script src="pages/import.js"></script>
  <script src="pages/duplicates.js"></script>
  <script src="pages/fields.js"></script>
  <script src="pages/find.js"></script>
  <script src="pages/lists.js"></script>
  <script src="pages/near.js"></script>
  <script src="pages/cards.js"></script>
  <script src="cardPrint.js"></script>
  <script src="pages/settings.js"></script>
  <script src="boot.js"></script>
</body>
</html>
